[project]
name = "resume-factory"
version = "2.0.0"
description = "Local-first tailored resume and cover letter generation with human-in-the-loop review."
requires-python = ">=3.11,<3.14"
dependencies = [
    "reflex>=0.9.0,<0.10.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "pdfplumber>=0.11.0",
    "openai>=1.50.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7.0", "mypy>=1.13.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfactory"]
