<svg viewBox="0 0 1420 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Resume Factory v2 runtime architecture: a user drives the Reflex UI, which calls a service layer that invokes a LangGraph state machine; the graph reads the job posting and master resume, calls the local LLM, renders through pdflatex, and writes checkpoints and PDFs to SQLite and disk, all inside a tailnet-only local machine boundary.">
  <title>Resume Factory v2 — runtime architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="arrowfill" />
    </marker>
  </defs>
  <style>
    .bgrect { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .arrowfill { fill: #1f2328; }
    .title { fill: #1f2328; font: 600 13px system-ui, sans-serif; }
    .h1 { fill: #1f2328; font: 600 16px system-ui, sans-serif; }
    .sub { fill: #57606a; font: 10.5px system-ui, sans-serif; }
    .tag { fill: #57606a; font: italic 9px system-ui, sans-serif; }
    .lbl { fill: #57606a; font: 10px system-ui, sans-serif; }
    .lblbg { fill: #ffffff; opacity: 0.92; }
    .line { stroke: #6e7781; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .line-emph { stroke: #1f2328; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line-dash { stroke: #57606a; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    .boundary-region { fill: none; stroke: #d0d7de; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .boundary-sec { fill: none; stroke: #9a6700; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .boundary-label { fill: #57606a; font: 600 10.5px system-ui, sans-serif; }
    .legend-text { fill: #57606a; font: 10px system-ui, sans-serif; }
    .acc-frontend { fill: #2563eb; }
    .acc-backend { fill: #7c3aed; }
    .acc-db { fill: #059669; }
    .acc-ext { fill: #6e7781; }

    @media (prefers-color-scheme: dark) {
      .bgrect { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .arrowfill { fill: #e6edf3; }
      .title { fill: #e6edf3; }
      .h1 { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .tag { fill: #8b949e; }
      .lbl { fill: #8b949e; }
      .lblbg { fill: #0d1117; }
      .line { stroke: #8b949e; }
      .line-emph { stroke: #e6edf3; }
      .line-dash { stroke: #8b949e; }
      .boundary-region { stroke: #30363d; }
      .boundary-sec { stroke: #d29922; }
      .boundary-label { fill: #8b949e; }
      .legend-text { fill: #8b949e; }
      .acc-frontend { fill: #60a5fa; }
      .acc-backend { fill: #a78bfa; }
      .acc-db { fill: #34d399; }
      .acc-ext { fill: #9198a1; }
    }
  </style>

  <rect class="bgrect" x="0" y="0" width="1420" height="660" />
  <text class="h1" x="10" y="26">Resume Factory v2 — runtime architecture</text>

  <!-- legend -->
  <g transform="translate(1010,20)">
    <circle cx="0" cy="0" r="4" class="acc-frontend" /><text class="legend-text" x="10" y="4">frontend</text>
    <circle cx="80" cy="0" r="4" class="acc-backend" /><text class="legend-text" x="90" y="4">backend</text>
    <circle cx="150" cy="0" r="4" class="acc-db" /><text class="legend-text" x="160" y="4">data store</text>
    <circle cx="230" cy="0" r="4" class="acc-ext" /><text class="legend-text" x="240" y="4">external / local process</text>
  </g>

  <!-- boundaries -->
  <rect class="boundary-region" x="302" y="72" width="1106" height="576" rx="10" />
  <text class="boundary-label" x="310" y="66">Local machine (offline-first)</text>

  <rect class="boundary-sec" x="306" y="316" width="538" height="98" rx="8" />
  <text class="boundary-label" x="316" y="310">Tailnet — UI + API only, no app login</text>

  <!-- connections -->
  <!-- user -> ui -->
  <line class="line-emph" x1="180" y1="365" x2="316" y2="365" />
  <rect class="lblbg" x="186" y="343" width="122" height="13" />
  <text class="lbl" x="190" y="352">edits, approve, reject</text>

  <!-- ui -> service -->
  <line class="line-emph" x1="490" y1="365" x2="656" y2="365" />
  <rect class="lblbg" x="501" y="343" width="108" height="13" />
  <text class="lbl" x="505" y="352">actions + thread_id</text>

  <!-- service -> graph -->
  <line class="line-emph" x1="830" y1="365" x2="996" y2="365" />
  <rect class="lblbg" x="841" y="343" width="98" height="13" />
  <text class="lbl" x="845" y="352">invoke / resume()</text>

  <!-- service -> db (dashed) -->
  <line class="line-dash" x1="745" y1="400" x2="995" y2="556" />
  <rect class="lblbg" x="786" y="471" width="172" height="13" />
  <text class="lbl" x="790" y="480">Application, DraftVersion rows</text>

  <!-- graph -> db -->
  <line class="line" x1="1060" y1="413" x2="995" y2="556" />
  <rect class="lblbg" x="1006" y="477" width="65" height="13" />
  <text class="lbl" x="1010" y="486">checkpoints</text>

  <!-- graph -> pdfs -->
  <line class="line" x1="1160" y1="413" x2="1290" y2="556" />
  <rect class="lblbg" x="1156" y="477" width="118" height="13" />
  <text class="lbl" x="1160" y="486">final resume + cover</text>

  <!-- graph -> llm -->
  <line class="line" x1="1030" y1="317" x2="755" y2="164" />
  <rect class="lblbg" x="811" y="253" width="122" height="13" />
  <text class="lbl" x="815" y="262">ingest, tailor, cover</text>

  <!-- graph -> master -->
  <line class="line" x1="1105" y1="317" x2="1020" y2="164" />
  <rect class="lblbg" x="981" y="229" width="157" height="13" />
  <text class="lbl" x="985" y="238">selects track-tagged bullets</text>

  <!-- graph -> latex -->
  <line class="line" x1="1180" y1="317" x2="1285" y2="164" />
  <rect class="lblbg" x="1136" y="253" width="137" height="13" />
  <text class="lbl" x="1140" y="262">render, trim, parse-back</text>

  <!-- jd -> graph (elbow, routed through the open band between the two rows) -->
  <polyline class="line" points="100,160 100,245 1000,245 1000,331" />
  <rect class="lblbg" x="296" y="228" width="197" height="13" />
  <text class="lbl" x="300" y="237">fetched best-effort via trafilatura</text>

  <!-- nodes -->
  <!-- jd -->
  <rect class="card" x="20" y="90" width="160" height="70" rx="8" />
  <rect class="acc-ext" x="20" y="90" width="4" height="70" rx="2" />
  <text class="title" x="100" y="118" text-anchor="middle">Job posting</text>
  <text class="sub" x="100" y="136" text-anchor="middle">fetched URL or pasted text</text>

  <!-- user -->
  <rect class="card" x="20" y="330" width="160" height="70" rx="8" />
  <rect class="acc-ext" x="20" y="330" width="4" height="70" rx="2" />
  <text class="title" x="100" y="358" text-anchor="middle">User</text>
  <text class="sub" x="100" y="376" text-anchor="middle">edits, approves, rejects</text>

  <!-- ui -->
  <rect class="card" x="320" y="330" width="170" height="70" rx="8" />
  <rect class="acc-frontend" x="320" y="330" width="4" height="70" rx="2" />
  <text class="title" x="405" y="352" text-anchor="middle">Reflex UI</text>
  <text class="sub" x="405" y="368" text-anchor="middle">dashboard, new, review, detail</text>
  <text class="tag" x="405" y="384" text-anchor="middle">holds thread_id only</text>

  <!-- service -->
  <rect class="card" x="660" y="330" width="170" height="70" rx="8" />
  <rect class="acc-backend" x="660" y="330" width="4" height="70" rx="2" />
  <text class="title" x="745" y="358" text-anchor="middle">Service layer</text>
  <text class="sub" x="745" y="376" text-anchor="middle">sync bridge via to_thread</text>

  <!-- graph -->
  <rect class="card" x="1000" y="317" width="210" height="96" rx="8" />
  <rect class="acc-backend" x="1000" y="317" width="4" height="96" rx="2" />
  <text class="title" x="1105" y="347" text-anchor="middle">LangGraph graph</text>
  <text class="sub" x="1105" y="367" text-anchor="middle">12 nodes, 2 human gates</text>
  <text class="tag" x="1105" y="385" text-anchor="middle">SqliteSaver checkpoints</text>

  <!-- llm -->
  <rect class="card" x="660" y="90" width="190" height="70" rx="8" />
  <rect class="acc-ext" x="660" y="90" width="4" height="70" rx="2" />
  <text class="title" x="755" y="118" text-anchor="middle">Qwen3-27B</text>
  <text class="sub" x="755" y="136" text-anchor="middle">local, LM Studio :1234/v1</text>

  <!-- master -->
  <rect class="card" x="920" y="90" width="200" height="70" rx="8" />
  <rect class="acc-db" x="920" y="90" width="4" height="70" rx="2" />
  <text class="title" x="1020" y="118" text-anchor="middle">master_resume.json</text>
  <text class="sub" x="1020" y="136" text-anchor="middle">track-tagged bullets, skills</text>

  <!-- latex -->
  <rect class="card" x="1190" y="90" width="190" height="70" rx="8" />
  <rect class="acc-ext" x="1190" y="90" width="4" height="70" rx="2" />
  <text class="title" x="1285" y="118" text-anchor="middle">pdflatex</text>
  <text class="sub" x="1285" y="136" text-anchor="middle">Jinja to TeX to PDF</text>

  <!-- db -->
  <rect class="card" x="900" y="560" width="190" height="70" rx="8" />
  <rect class="acc-db" x="900" y="560" width="4" height="70" rx="2" />
  <text class="title" x="995" y="588" text-anchor="middle">SQLite</text>
  <text class="sub" x="995" y="606" text-anchor="middle">checkpoints + application rows</text>

  <!-- pdfs -->
  <rect class="card" x="1190" y="560" width="200" height="70" rx="8" />
  <rect class="acc-db" x="1190" y="560" width="4" height="70" rx="2" />
  <text class="title" x="1290" y="588" text-anchor="middle">PDF artifacts</text>
  <text class="sub" x="1290" y="606" text-anchor="middle">.rfdata/out, served at /api/pdf</text>
</svg>
