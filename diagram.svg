<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 990" width="1800" height="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Resume Factory v2 architecture: you reach the Reflex UI over Tailscale; a six-stage LangGraph pipeline (quick scan, tailor, verify claims, render and score, human review, cover letter) runs on your Mac against a local LLM, master_resume.json, pdflatex and SQLite, kept alive by launchd.">
<title>Resume Factory v2 — architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f76b15"/></marker><radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#f76b15" stop-opacity="0.16"/><stop offset="1" stop-color="#f76b15" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1800" height="990" rx="28" fill="#0b1220" stroke="none" stroke-width="0" />
<rect x="0" y="0" width="1800" height="990" rx="28" fill="url(#glow)" stroke="none" stroke-width="0" />
<text x="60" y="66" font-size="34" fill="#e5e7eb" font-weight="800" text-anchor="start">Resume Factory v2</text>
<text x="60" y="98" font-size="17" fill="#94a3b8" font-weight="400" text-anchor="start">Tailored resumes and cover letters that never invent a fact. Runs entirely on your Mac.</text>
<rect x="70" y="128" width="250" height="66" rx="14" fill="#16213a" stroke="#3b4a6b" stroke-width="1.5" />
<text x="195" y="157" font-size="19" fill="#e5e7eb" font-weight="700" text-anchor="middle">You</text>
<text x="195" y="180" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle">laptop or phone</text>
<line x1="195" y1="194" x2="195" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="212" y="222" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Tailscale · private network, no login</text>
<rect x="40" y="238" width="1720" height="712" rx="26" fill="none" stroke="#3b4a6b" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="1428" y="226" width="318" height="24" rx="12" fill="#0b1220"/>
<text x="1735" y="243" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="end" letter-spacing="1.5">YOUR MAC — nothing leaves this box</text>
<rect x="70" y="268" width="250" height="92" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-width="2" />
<text x="195" y="302" font-size="19" fill="#e5e7eb" font-weight="700" text-anchor="middle">Reflex UI  :3210</text>
<text x="195" y="326" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle">dashboard · new · review</text>
<text x="195" y="346" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">3 skins: minimal · glass · skeuo</text>
<line x1="195" y1="360" x2="195" y2="424" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="212" y="392" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">start · resume · decide</text>
<text x="360" y="306" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">The UI holds only a thread id.</text>
<text x="360" y="328" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">The pipeline owns all state, checkpointed after every step.</text>
<rect x="1000" y="266" width="720" height="104" rx="14" fill="#0e1729" stroke="#24314f" stroke-width="1.5" />
<text x="1024" y="296" font-size="17" fill="#e5e7eb" font-weight="700" text-anchor="start">↻  Always on — launchd</text>
<text x="1696" y="296" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="end">starts at login · restarts on crash</text>
<circle cx="1032" cy="324" r="5" fill="#34d399"/>
<text x="1046" y="329" font-size="13" fill="#34d399" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">com.resumefactory.app</text>
<text x="1290" y="329" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Reflex UI + API, prod mode, one port</text>
<circle cx="1032" cy="354" r="5" fill="#34d399"/>
<text x="1046" y="359" font-size="13" fill="#34d399" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">com.resumefactory.lmstudio</text>
<text x="1290" y="359" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">local model server</text>
<text x="1720" y="414" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="end">LangGraph · 12 nodes · 2 human gates</text>
<text x="1458" y="414" font-size="13" fill="#f76b15" font-weight="800" text-anchor="end" letter-spacing="2">THE PIPELINE</text>
<rect x="70" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<circle cx="104" cy="466" r="16" fill="#1f2a44"/>
<text x="104" y="471.5" font-size="15" fill="#e5e7eb" font-weight="800" text-anchor="middle">1</text>
<text x="130" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Quick scan</text>
<text x="94" y="512" font-size="12" fill="#7dd3fc" font-weight="800" text-anchor="start" letter-spacing="1.2">SHOULD I APPLY?</text>
<text x="94" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">match % + Apply / Stretch /</text>
<text x="94" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">Skip verdict</text>
<text x="94" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">strengths, gaps, missing tools</text>
<rect x="94" y="626" width="43" height="24" rx="12" fill="#a78bfa" fill-opacity="0.16"/>
<text x="115.4" y="642.5" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM</text>
<rect x="144.8" y="626" width="66" height="24" rx="12" fill="#34d399" fill-opacity="0.16"/>
<text x="177.60000000000002" y="642.5" font-size="12" fill="#34d399" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">master</text>
<line x1="322" y1="550.0" x2="348" y2="550.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="350" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<circle cx="384" cy="466" r="16" fill="#1f2a44"/>
<text x="384" y="471.5" font-size="15" fill="#e5e7eb" font-weight="800" text-anchor="middle">2</text>
<text x="410" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Tailor</text>
<text x="374" y="512" font-size="12" fill="#7dd3fc" font-weight="800" text-anchor="start" letter-spacing="1.2">SELECT + REPHRASE</text>
<text x="374" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">picks bullets from your</text>
<text x="374" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">master resume and rewrites</text>
<text x="374" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">them for the posting</text>
<rect x="374" y="626" width="43" height="24" rx="12" fill="#a78bfa" fill-opacity="0.16"/>
<text x="395.4" y="642.5" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM</text>
<rect x="424.8" y="626" width="66" height="24" rx="12" fill="#34d399" fill-opacity="0.16"/>
<text x="457.6" y="642.5" font-size="12" fill="#34d399" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">master</text>
<line x1="602" y1="550.0" x2="628" y2="550.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="630" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<circle cx="664" cy="466" r="16" fill="#1f2a44"/>
<text x="664" y="471.5" font-size="15" fill="#e5e7eb" font-weight="800" text-anchor="middle">3</text>
<text x="690" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Verify claims</text>
<text x="654" y="512" font-size="12" fill="#7dd3fc" font-weight="800" text-anchor="start" letter-spacing="1.2">NO INVENTED FACTS</text>
<text x="654" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">every number, name and tool</text>
<text x="654" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">checked against the source</text>
<text x="654" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">fails → retry, then revert</text>
<rect x="654" y="626" width="66" height="24" rx="12" fill="#34d399" fill-opacity="0.16"/>
<text x="686.8" y="642.5" font-size="12" fill="#34d399" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">master</text>
<line x1="882" y1="550.0" x2="908" y2="550.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="910" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<circle cx="944" cy="466" r="16" fill="#1f2a44"/>
<text x="944" y="471.5" font-size="15" fill="#e5e7eb" font-weight="800" text-anchor="middle">4</text>
<text x="970" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Render + score</text>
<text x="934" y="512" font-size="12" fill="#7dd3fc" font-weight="800" text-anchor="start" letter-spacing="1.2">ONE PAGE, PROVEN</text>
<text x="934" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">Jinja → LaTeX → PDF</text>
<text x="934" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">ATS match 45/35/10/10</text>
<text x="934" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">parse-back with 2 extractors</text>
<rect x="934" y="626" width="58" height="24" rx="12" fill="#fb923c" fill-opacity="0.16"/>
<text x="963.0" y="642.5" font-size="12" fill="#fb923c" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LaTeX</text>
<line x1="1162" y1="550.0" x2="1188" y2="550.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1190" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#f76b15" stroke-width="2" />
<circle cx="1224" cy="466" r="16" fill="#f76b15"/>
<text x="1224" y="471.5" font-size="15" fill="#0b1220" font-weight="800" text-anchor="middle">5</text>
<text x="1250" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Review</text>
<text x="1214" y="512" font-size="12" fill="#f76b15" font-weight="800" text-anchor="start" letter-spacing="1.2">YOU DECIDE</text>
<text x="1214" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">edit, approve or reject</text>
<text x="1214" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">run pauses here — even</text>
<text x="1214" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">for days, survives restarts</text>
<rect x="1214" y="626" width="66" height="24" rx="12" fill="#60a5fa" fill-opacity="0.16"/>
<text x="1246.8" y="642.5" font-size="12" fill="#60a5fa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SQLite</text>
<line x1="1442" y1="550.0" x2="1468" y2="550.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="1420" y="473" font-size="18" fill="#e5e7eb" font-weight="400" text-anchor="end">✋</text>
<rect x="1470" y="430" width="250" height="240" rx="16" fill="#111a2e" stroke="#f76b15" stroke-width="2" />
<circle cx="1504" cy="466" r="16" fill="#f76b15"/>
<text x="1504" y="471.5" font-size="15" fill="#0b1220" font-weight="800" text-anchor="middle">6</text>
<text x="1530" y="473" font-size="20" fill="#e5e7eb" font-weight="750" text-anchor="start">Cover letter</text>
<text x="1494" y="512" font-size="12" fill="#f76b15" font-weight="800" text-anchor="start" letter-spacing="1.2">SAME CHECKS</text>
<text x="1494" y="542" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">drafted from the approved</text>
<text x="1494" y="565" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">resume, second review gate</text>
<text x="1494" y="588" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">→ final PDFs</text>
<rect x="1494" y="626" width="43" height="24" rx="12" fill="#a78bfa" fill-opacity="0.16"/>
<text x="1515.4" y="642.5" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM</text>
<rect x="1544.8" y="626" width="58" height="24" rx="12" fill="#fb923c" fill-opacity="0.16"/>
<text x="1573.8" y="642.5" font-size="12" fill="#fb923c" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LaTeX</text>
<text x="1700" y="473" font-size="18" fill="#e5e7eb" font-weight="400" text-anchor="end">✋</text>
<rect x="683" y="680" width="144" height="26" rx="13" fill="#1f2a44"/>
<text x="755" y="697.5" font-size="12.5" fill="#cbd5e1" font-weight="600" text-anchor="middle">↺ retry up to 3×</text>
<rect x="952" y="680" width="167" height="26" rx="13" fill="#1f2a44"/>
<text x="1035" y="697.5" font-size="12.5" fill="#cbd5e1" font-weight="600" text-anchor="middle">↺ trim until 1 page</text>
<path d="M1315,670 L1315,722 Q1315,732 1305,732 L485,732 Q475,732 475,722 L475,674" fill="none" stroke="#f76b15" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aho)"/>
<rect x="745.0" y="720" width="300" height="24" fill="#0b1220"/>
<text x="895.0" y="737" font-size="13" fill="#f76b15" font-weight="700" text-anchor="middle">reject with feedback → re-tailor</text>
<text x="70" y="784" font-size="13" fill="#f76b15" font-weight="800" text-anchor="start" letter-spacing="2">RUNS ON</text>
<rect x="70" y="800" width="393" height="118" rx="14" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<rect x="70" y="800" width="6" height="118" rx="3" fill="#a78bfa"/>
<rect x="94" y="818" width="43" height="24" rx="12" fill="#a78bfa" fill-opacity="0.16"/>
<text x="115.4" y="834.5" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LLM</text>
<text x="94" y="868" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="start">Local LLM</text>
<text x="94" y="892" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">LM Studio · Qwen3-27B</text>
<text x="94" y="910" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">OpenAI-style gateway optional</text>
<rect x="489" y="800" width="393" height="118" rx="14" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<rect x="489" y="800" width="6" height="118" rx="3" fill="#34d399"/>
<rect x="513" y="818" width="66" height="24" rx="12" fill="#34d399" fill-opacity="0.16"/>
<text x="545.8" y="834.5" font-size="12" fill="#34d399" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">master</text>
<text x="513" y="868" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="start">master_resume.json</text>
<text x="513" y="892" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">single source of truth</text>
<text x="513" y="910" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">track-tagged bullets + skills</text>
<rect x="908" y="800" width="393" height="118" rx="14" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<rect x="908" y="800" width="6" height="118" rx="3" fill="#fb923c"/>
<rect x="932" y="818" width="58" height="24" rx="12" fill="#fb923c" fill-opacity="0.16"/>
<text x="961.0" y="834.5" font-size="12" fill="#fb923c" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LaTeX</text>
<text x="932" y="868" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="start">pdflatex</text>
<text x="932" y="892" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">TLCresume.sty templates</text>
<text x="932" y="910" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">pdftotext for parse-back</text>
<rect x="1327" y="800" width="393" height="118" rx="14" fill="#111a2e" stroke="#24314f" stroke-width="1.5" />
<rect x="1327" y="800" width="6" height="118" rx="3" fill="#60a5fa"/>
<rect x="1351" y="818" width="66" height="24" rx="12" fill="#60a5fa" fill-opacity="0.16"/>
<text x="1383.8" y="834.5" font-size="12" fill="#60a5fa" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SQLite</text>
<text x="1351" y="868" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="start">SQLite</text>
<text x="1351" y="892" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">graph checkpoints + applications</text>
<text x="1351" y="910" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">PDFs in .rfdata/out</text>
